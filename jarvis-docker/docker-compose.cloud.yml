# Jarvis - cloud deployment (Railway, 1 GB)
#
# What this file is for
#   A three-service stack: edge (public), ui (SPA + token-injecting API proxy), core (FastAPI +
#   CrewAI). It deliberately has NO voice, NO tool-* containers, NO Squid proxy and NO hostlink
#   network: none of those can work on a cloud host.
#
# Why there is no Ollama here
#   The Railway instance has ~1 GB of RAM, which cannot hold a local model. The LLM is therefore a
#   hosted API (Groq or OpenRouter, chosen with LLM_PROVIDER) reached over HTTPS. Embeddings use
#   OpenAI text-embedding-3-small when OPENAI_API_KEY is set; without it rag_setup falls back to
#   deterministic hashed vectors so the server always starts, with no model download and no extra
#   service.
#
# Differences from docker-compose.yml (local)
#   - No secrets: blocks. Railway has no /run/secrets, so CORE_API_TOKEN comes from the
#     environment. core and ui both read the same value (core validates it, ui injects it).
#   - IS_CLOUD=true: /api/host/* is not registered, the agent loses the host tools, and the LLM
#     comes from the configured cloud provider instead of Ollama.
#   - The edge listens on $PORT (Railway injects it); the template is rendered at start-up.
#   - Bind mounts are replaced by a named volume.
#   - No HTTP(S)_PROXY: Railway egress is direct.
#
# Usage (local check of the cloud shape)
#   $env:CORE_API_TOKEN   = "local-cloud-test-token"
#   $env:GROQ_API_KEY     = "gsk_..."        # or OPENROUTER_API_KEY + LLM_PROVIDER=openrouter
#   docker compose -f docker-compose.cloud.yml up --build
#
# Usage (Railway)
#   Create a Compose service from the repo with this file, set the variables below, and attach a
#   persistent volume to `core` at /data. Railway ignores `ports`, named volumes and `mem_limit`
#   from the compose file; configure those in the Railway service settings.
#
# Required variables
#   CORE_API_TOKEN   Shared bearer token. Generate a long random value; both core and ui use it.
#   One provider key: GROQ_API_KEY (LLM_PROVIDER=groq, the default) or OPENROUTER_API_KEY
#   (LLM_PROVIDER=openrouter).
# Optional variables
#   PORT (Railway sets it), LLM_PROVIDER, GROQ_MODEL, OPENROUTER_MODEL, OPENAI_API_KEY,
#   EMBED_PROVIDER, BRIEFING_*, CORE_MEM_LIMIT.
#   Model defaults are current, working ids: GROQ_MODEL=openai/gpt-oss-20b (Groq no longer serves
#   llama3-70b-8192 and its Llama models are enterprise-only) and
#   OPENROUTER_MODEL=google/gemma-4-31b-it:free (meta-llama/llama-3-8b-instruct:free is gone).
#   Override them with any model your key can reach.
#   OPENAI_API_KEY enables OpenAI embeddings; without it the offline hashed fallback is used.
#   CORE_UPSTREAM / UI_UPSTREAM: edge proxy targets, default core:8000 and ui:8080. Set these if
#   the platform exposes services under different DNS names (e.g. core.railway.internal:8000).

name: jarvis-cloud

x-hardened: &hardened
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------------------
  # Core API + CrewAI. Hosted LLM (Groq or OpenRouter), OpenAI or hashed embeddings, no local
  # inference. No host bridge on cloud: IS_CLOUD removes /api/host/* and the host tools.
  # ---------------------------------------------------------------------------------------
  core:
    <<: *hardened
    build:
      context: ../jarvis-core
      dockerfile: Dockerfile
    image: jarvis-core:local
    mem_limit: ${CORE_MEM_LIMIT:-1g}
    memswap_limit: ${CORE_MEM_LIMIT:-1g}
    environment:
      IS_CLOUD: "true"
      # Read by app.main._load_api_token when /run/secrets does not exist.
      CORE_API_TOKEN: ${CORE_API_TOKEN:?CORE_API_TOKEN must be set (shared by core and ui)}
      # app.crew_factory picks groq (default) or openrouter; only that provider's key is needed.
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-4-31b-it:free}
      # app.rag_setup: OpenAI embeddings when the key is set, else the offline hashed fallback.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-}
      # Persistent state lives on the jarvis_data volume.
      CREWAI_STORAGE_DIR: /data/crewai
      CHROMA_PERSIST_DIR: /data/chroma
      BRIEFING_SCHEDULER_ENABLED: ${BRIEFING_SCHEDULER_ENABLED:-true}
      BRIEFING_TIMEZONE: ${BRIEFING_TIMEZONE:-UTC}
      BRIEFING_HOUR: ${BRIEFING_HOUR:-8}
      BRIEFING_MINUTE: ${BRIEFING_MINUTE:-0}
      JARVIS_OPS_DB: ${JARVIS_OPS_DB:-/data/operations.db}
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
    volumes:
      - jarvis_data:/data
    tmpfs:
      - /tmp:size=256m
    expose:
      - "8000"

  # ---------------------------------------------------------------------------------------
  # React UI: serves the SPA and proxies /api/* to core, injecting the bearer token.
  # ---------------------------------------------------------------------------------------
  ui:
    <<: *hardened
    build:
      context: ../jarvis-ui-react
      dockerfile: Dockerfile
    image: jarvis-ui-react:local
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      # docker-entrypoint.sh falls back to this when the secret file is absent.
      CORE_API_TOKEN: ${CORE_API_TOKEN:?CORE_API_TOKEN must be set (shared by core and ui)}
    tmpfs:
      - /tmp:size=128m
    expose:
      - "8080"
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------------------
  # Public edge. Listens on $PORT so Railway can route to it unchanged.
  # The stock nginx entrypoint would render into a read-only /etc/nginx/conf.d, so we run our
  # own render step and point nginx at /tmp/nginx.conf.
  # ---------------------------------------------------------------------------------------
  edge:
    <<: *hardened
    image: nginx:1.27-alpine
    mem_limit: 64m
    memswap_limit: 64m
    environment:
      PORT: ${PORT:-8080}
      # Override these if the platform's service DNS differs (e.g. *.railway.internal).
      CORE_UPSTREAM: ${CORE_UPSTREAM:-core:8000}
      UI_UPSTREAM: ${UI_UPSTREAM:-ui:8080}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./nginx.cloud.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    tmpfs:
      - /tmp:size=64m
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        envsubst '$${PORT} $${CORE_UPSTREAM} $${UI_UPSTREAM}'
        < /etc/nginx/templates/nginx.conf.template > /tmp/nginx.conf &&
        exec nginx -c /tmp/nginx.conf -g 'daemon off;'
    depends_on:
      - ui
      - core

volumes:
  jarvis_data:
